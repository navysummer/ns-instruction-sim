[package]
name = "ns-instruction-sim"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]
resolver = "3"
members = ["crates/ns-sim", "crates/ns-device", "."]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ns-sim = { path = "crates/ns-sim" }
ns-device = { path = "crates/ns-device" }
